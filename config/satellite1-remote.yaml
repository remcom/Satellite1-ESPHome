substitutions:
  company_name: FutureProofHomes
  project_name: Satellite1

packages:
  # This is an inline package to prefix the on_client_connected with the wait_until action
  # It must appear before the actual package so it becomes the orignal config and the
  # on_client_connected list from the package config is appended onto this one.
  va_connected_wait_for_ble_and_flasher:
    voice_assistant:
      on_client_connected:
        - wait_until:
            not: ble.enabled
        - wait_until:
            not: memory_flasher.in_progress
        - delay: 2s

    wifi:
      on_disconnect:
        - ble.enable:
      on_connect:
        - delay: 5s  # Gives time for improv results to be transmitted
        - ble.disable:
        # Enable/disable Sendspin static adjustment delay if the jack is plugged in or not
        - if:
            condition:
              - binary_sensor.is_on: line_out_sensor
            then:
              - sendspin.media_source.enable_static_delay_adjustment:
            else:
              - sendspin.media_source.disable_static_delay_adjustment:

    satellite1:
      on_xmos_no_response:
        then:
          - if:
              condition:
                - lambda: return id(init_in_progress);
                - lambda: return id(xflash).has_image_embedded();
              then:
                - memory_flasher.write_embedded_image:

      on_xmos_connected:
        then:
          - delay: 1s
          - script.execute: control_leds
          - if:
              condition:
                - lambda: return id(init_in_progress);
                - lambda: return id(xflash).has_image_embedded();
                - lambda: return !id(xflash).match_embedded( id(satellite1_id).get_xmos_fw_version() );
              then:
                - memory_flasher.write_embedded_image:

  home-assistant-voice: !include satellite1.base.yaml

esphome:
  project:
    name: ${company_name}.${project_name}
    version: ${esp32_fw_version}

improv_ble:
  authorizer: btn_action
  on_start:
    - lambda: id(improv_ble_in_progress) = true;
    - script.execute: control_leds
  on_provisioned:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_stop:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds

external_components:
  # FPH Custom Components - fetched from GitHub for remote/dashboard builds
  - source:
      type: git
      url: https://github.com/remcom/Satellite1-ESPHome
      ref: main
      path: esphome/components
    components:
      - memory_flasher
      - satellite1
  # USB-PD controller, merged upstream in esphome/esphome#20632/#20760/#20796 (dev, not yet released):
  # https://github.com/esphome/esphome/tree/dev/esphome/components/fusb302b
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: 06b585d3733d634427abb492099d1373a58598fa
    components:
      - fusb302b
  # i2s_audio (full duplex, several speakers per bus), merged upstream in esphome/esphome#19959
  # (dev, not yet released). Upstream dev needs ESPHome 2026.11 core APIs, so this uses the
  # 2026.10 backport: https://github.com/remcom/esphome/tree/i2s_audio-dev-2026.10
  - source:
      type: git
      url: https://github.com/remcom/esphome
      ref: ee69f9b32ea3489dad5c51d8e0333b56084da0f4
    components:
      - i2s_audio

logger:

ota:
  - platform: http_request
    id: ota_http_request
