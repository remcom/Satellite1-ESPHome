# Shared by satellite1.common.yaml (local builds) and satellite1-remote.yaml (dashboard builds).
# Included as the FIRST package, so it becomes the original config and the automation lists from
# satellite1.base.yaml are appended onto these: the wait_until steps run before on_client_connected
# of the voice assistant, and the boot-time XMOS update before the base on_xmos_connected actions.

voice_assistant:
  on_client_connected:
    - wait_until:
        not: ble.enabled
    - wait_until:
        not: memory_flasher.in_progress
    - delay: 2s

wifi:
  on_disconnect:
    - ble.enable:
  on_connect:
    - delay: 5s  # Gives time for improv results to be transmitted
    - ble.disable:
    # Enable/disable Sendspin static adjustment delay if the jack is plugged in or not
    - if:
        condition:
          - binary_sensor.is_on: line_out_sensor
        then:
          - sendspin.media_source.enable_static_delay_adjustment:
        else:
          - sendspin.media_source.disable_static_delay_adjustment:

satellite1:
  on_xmos_no_response:
    then:
      - if:
          condition:
            - lambda: return id(init_in_progress);
            - lambda: return id(xflash).has_image_embedded();
          then:
            - memory_flasher.write_embedded_image:

  on_xmos_connected:
    then:
      - delay: 1s
      - script.execute: control_leds
      - if:
          condition:
            - lambda: return id(init_in_progress);
            - lambda: return id(xflash).has_image_embedded();
            - lambda: return !id(xflash).match_embedded( id(satellite1_id).get_xmos_fw_version() );
          then:
            # Update the XMOS to this build's release, keeping the selected firmware variant
            - if:
                condition:
                  lambda: return id(xmos_fw_variant).active_index().value_or(0) == 1;
                then:
                  # The AEC4 image is downloaded. If WiFi doesn't come up or the download fails,
                  # the standard image is installed instead (fallback 2) and "XMOS Reflash
                  # Required" stays on until AEC4 is installed with the button.
                  - wait_until:
                      condition:
                        wifi.connected:
                      timeout: 60s
                  - script.execute:
                      id: xmos_install_selected_firmware
                      fallback: 2
                else:
                  - memory_flasher.write_embedded_image:
