substitutions:
  # Change to any preferred name
  friendly_name: "Satellite1"

  # Change to calibrate your temperature/humidity sensor readings. Humidity is recomputed for
  # the temperature offset automatically; humidity_offset is an extra flat trim on top.
  temp_offset: "-3"
  humidity_offset: "0"

  # Recommend leaving the following unchanged
  node_name: satellite1
  company_name: FutureProofHomes
  project_name: Satellite1
  component_name: Core

  esp32_fw_version: dev
  # XMOS firmware release. The images are downloaded by the file name that carries the tag, so the
  # version string and the image can't point at different releases.
  xmos_fw_version: "v2.0.0-beta.2"
  xmos_fw_release_url: https://github.com/remcom/Satellite1-XMOS/releases/download/${xmos_fw_version}

globals:
  # Global initialisation variable. Initialized to true and set to false once everything is connected. Only used to have a smooth "plugging" experience
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  # Global variable storing if user action causes warning
  - id: warning
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking the XMOS flasher status.
  - id: xmos_flashing_state
    type: int
    restore_value: no
    initial_value: '0'
  # Set while an XMOS image downloaded from the release is flashed. 1: fall back to the embedded
  # standard image only if the failed flash had already erased the XMOS, 2: always fall back (the
  # boot-time update, where the old image must not stay on the XMOS). See on_flashing_failed.
  - id: xmos_remote_flash_fallback
    type: int
    restore_value: no
    initial_value: '0'

esphome:
  name: ${node_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  min_version: 2026.11.0

  project:
    name: ${company_name}.${project_name}
    version: ${esp32_fw_version}

  on_boot:
    # Negative priority: this runs after every component is set up, so the LED ring
    # driven by control_leds (via the switch's on_turn_* triggers) is ready. The
    # hardware switch always wins over master_mute_switch's restored state.
    - priority: -100
      then:
        - switch.template.publish:
            id: master_mute_switch
            state: !lambda return id(btn_left).state;

    - priority: 375
      then:
        - logger.log: "${company_name} ${project_name} ${component_name} running ESP firmware: ${esp32_fw_version} and XMOS firmware: ${xmos_fw_version}"
        # Run the script to refresh the LED status
        - script.execute: control_leds

        # If after 10 minutes, the device is still initializing (It did not yet connect to Home Assistant), turn off the init_in_progress variable and run the script to refresh the LED status
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds

ota:
  - platform: esphome
    id: ota_esphome
    allow_partition_access: true

packages:
  core_board: !include common/core_board.yaml
  wifi: !include common/wifi_improv.yaml
  sensors: !include common/hat_sensors.yaml
  buttons: !include common/buttons.yaml
  ha: !include common/home_assistant.yaml
  mp: !include common/media_player.yaml
  va: !include common/voice_assistant.yaml
  timer: !include common/timer.yaml
  led_ring: !include common/led_ring.yaml
  xmos_audio: !include common/xmos_audio.yaml
  xmos_firmware: !include common/xmos_firmware.yaml
  debug: !include common/debug.yaml

  ## OPTIONAL COMPONENTS
  # mmwave_ld2410: !include common/mmwave_ld2410.yaml
  # mmwave_ld2450: !include common/mmwave_ld2450.yaml
  # sendspin_source: !include common/sendspin_source.yaml
  # debug: !include common/debug.yaml
  # developer: !include common/developer.yaml

http_request:
  buffer_size_rx: 2048
  buffer_size_tx: 1024
  timeout: 30s

safe_mode:

status_led:
  pin:
    number: GPIO45
    ignore_strapping_warning: true

satellite1:
  id: satellite1_id
  spi_id: spi_0
  cs_pin: GPIO10
  data_rate: 8000000
  spi_mode: MODE3
  xmos_rst_pin: GPIO4

  on_xmos_no_response:
    then:
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'

  on_xmos_connected:
    then:
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'
      # Loads the audio settings of the firmware variant if it changed, see common/xmos_firmware.yaml
      - script.execute: xmos_sync_variant_settings
      - script.execute: apply_xmos_mic_settings

  on_xmos_detached:
    then:
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'

memory_flasher:
  - platform: satellite1
    id: xflash
    embed_flash_image:
      image_version: ${xmos_fw_version}
      # image_file: ../satellite1_firmware_fixed_delay.factory.bin
      # md5_file: ../satellite1_firmware_fixed_delay.factory.md5
      # Always the standard (fixed_delay) variant. The AEC4 variant is downloaded when it is selected,
      # see common/xmos_firmware.yaml.
      image_file: ${xmos_fw_release_url}/satellite1_xmos-${xmos_fw_version}.factory.bin
      md5_file: ${xmos_fw_release_url}/satellite1_xmos-${xmos_fw_version}.factory.md5

    on_flashing_start:
      then:
        - lambda: id(xmos_flashing_state) = 1;
        - script.execute: control_leds

    on_progress_update:
      then:
        - lambda: id(global_led_animation_index) = id(xflash).get_flashing_progress() * 24 / 100;
        - script.execute: control_leds

    on_flashing_success:
      then:
        - logger.log: "XMOS firmware flashed"
        - lambda: id(xmos_remote_flash_fallback) = 0;
        - lambda: id(xmos_flashing_state) = 2;
        - script.execute: control_leds
        - lambda: id(xmos_flashing_state) = 0;
        - script.execute: tas2780_reactivate

    on_flashing_failed:
      then:
        - logger.log:
            level: WARN
            format: "XMOS firmware flashing failed"
        - lambda: id(xmos_flashing_state) = 3;
        - script.execute: control_leds
        - lambda: id(xmos_flashing_state) = 0;
        # A downloaded image (the AEC4 variant) failed: install the standard image embedded in this
        # build, so the XMOS isn't left erased, or on an older release than this build expects.
        - if:
            condition:
              lambda: |-
                const int fallback = id(xmos_remote_flash_fallback);
                id(xmos_remote_flash_fallback) = 0;
                return fallback == 2 || (fallback == 1 && id(xflash).failed_after_erase());
            then:
              - logger.log:
                  level: WARN
                  format: "Installing the standard XMOS firmware embedded in this build instead"
              # The flasher only returns to idle after this trigger has run
              - delay: 1s
              - memory_flasher.write_embedded_image:

    on_erasing_done:
      then:
        - if:
            condition:
              lambda: return id(factory_reset_requested);
            then:
              - button.press: factory_reset_button

