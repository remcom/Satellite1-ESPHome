name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same branch/PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth: runs exactly the hooks in .pre-commit-config.yaml
  # (yamllint over config/ + .github/, clang-format over components/), so CI
  # and local commits can't drift apart.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  clang-tidy:
    name: clang-tidy (components)
    runs-on: ubuntu-latest
    # Cold cache pays for the one-off ESP-IDF toolchain download.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      # esphome.espidf keeps its toolchain and ccache under the platformdirs
      # user cache; without this every run re-downloads ESP-IDF.
      - name: Cache ESP-IDF toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esphome-idf-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            esphome-idf-${{ runner.os }}-

      - name: Install ESPHome and clang-tidy
        run: |
          pip install -r requirements.txt
          pip install clang-tidy==18.1.8

      - name: Run clang-tidy on components/ and esphome/components/
        run: python3 scripts/run_clang_tidy.py
