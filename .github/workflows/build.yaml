name: Build ESPHome firmware on release

on:
  release:
    types: [published]

permissions:
  contents: write

# Never cancel a release build half-way through; just don't run two for the
# same tag at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds run in parallel, but only stage artifacts -- every write to a shared
  # release happens in the single `publish` job below, so the matrix can't race
  # itself deleting/uploading assets on the same tag.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        device:
          - satellite1
          - satellite1.ld2450
          - satellite1.ld2410

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version variables
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          SAFE_VERSION="${GITHUB_REF_NAME//-/_}"
          echo "SAFE_VERSION=${SAFE_VERSION}" >> $GITHUB_ENV

      - name: Get ESPHome version from requirements.txt
        run: |
          ESPHOME_VERSION=$(grep -oP 'esphome==\K[^\s]+' requirements.txt)
          if [ -z "$ESPHOME_VERSION" ]; then
            echo "Could not determine esphome version from requirements.txt"; exit 1;
          fi
          echo "ESPHOME_VERSION=${ESPHOME_VERSION}" >> $GITHUB_ENV

      - name: Build ESPHome firmware
        id: build
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667 # v8.1.0
        with:
          yaml-file: "config/${{ matrix.device }}.yaml"
          complete-manifest: true
          version: ${{ env.ESPHOME_VERSION }}
          release-url: ${{ github.event.release.html_url }}
          release-summary: ${{ github.event.release.body }}
          substitutions: |
            esp32_fw_version=${{ env.VERSION }}

      - name: Stage versioned and channel artifacts
        env:
          DEVICE: ${{ matrix.device }}
          OUTDIR: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          SAFE_VERSION="${{ env.SAFE_VERSION }}"

          if [ ! -d "$OUTDIR" ]; then
            echo "Build output directory '$OUTDIR' not found for ${DEVICE}"; exit 1;
          fi

          mkdir -p "staging/versioned" "staging/channel"

          for f in "$OUTDIR"/*; do
            base=$(basename "$f")
            # Handle double extensions like .ota.bin
            if [[ "$base" == *.ota.bin ]]; then
              ext="ota.bin"
              channel_name="${DEVICE}.ota.bin"
            elif [[ "$base" == *.bin ]]; then
              ext="bin"
              channel_name="${DEVICE}.bin"
            elif [[ "$base" == manifest.json ]]; then
              ext="manifest.json"
              channel_name="${DEVICE}-manifest.json"
            else
              ext="${base##*.}"
              channel_name="${DEVICE}.${ext}"
            fi
            cp "$f" "staging/versioned/${DEVICE}-${SAFE_VERSION}.${ext}"
            cp "$f" "staging/channel/${channel_name}"
          done

          # Fix paths in the channel manifest to match the renamed files
          MANIFEST="staging/channel/${DEVICE}-manifest.json"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/-esp32s3\.ota\.bin/.ota.bin/g' "$MANIFEST"
            sed -i 's/-esp32s3\.factory\.bin/.bin/g' "$MANIFEST"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ matrix.device }}
          path: staging/
          if-no-files-found: error
          retention-days: 7

  # Single owner of both the versioned release and the rolling channel release,
  # so asset deletes/uploads are serialized across all three devices.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set version and channel variables
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          if [ "${{ github.event.release.prerelease }}" == "true" ]; then
            echo "CHANNEL=beta" >> $GITHUB_ENV
          else
            echo "CHANNEL=latest" >> $GITHUB_ENV
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Generate landing manifest
        run: |
          REPO="${GITHUB_REPOSITORY}"
          CHANNEL="${{ env.CHANNEL }}"

          cat <<EOF > dist/channel/landing-manifest.json
          {
            "version": "${GITHUB_REF_NAME}",
            "devices": {
              "satellite1": { "manifest_url": "https://github.com/${REPO}/releases/download/${CHANNEL}/satellite1-manifest.json" },
              "satellite1.ld2450": { "manifest_url": "https://github.com/${REPO}/releases/download/${CHANNEL}/satellite1.ld2450-manifest.json" },
              "satellite1.ld2410": { "manifest_url": "https://github.com/${REPO}/releases/download/${CHANNEL}/satellite1.ld2410-manifest.json" }
            }
          }
          EOF

      - name: Upload versioned artifacts to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/versioned/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sweep every asset this workflow owns, for all devices at once. Doing
      # this per-device in the matrix was unsafe: the `satellite1` prefix also
      # matches `satellite1.ld2410.*`, so a parallel job could delete another
      # device's freshly-uploaded assets.
      - name: Delete superseded channel assets
        run: |
          set -uo pipefail
          # A first-ever beta/latest release doesn't exist yet, and a matchless
          # grep exits 1 -- neither is an error here.
          EXISTING=$(gh release view "${{ env.CHANNEL }}" --json assets -q '.assets[].name' 2>/dev/null || true)
          STALE=$(grep -E '^(satellite1|landing-manifest\.json$)' <<< "$EXISTING" || true)
          for asset in $STALE; do
            echo "Deleting old asset: $asset"
            gh release delete-asset "${{ env.CHANNEL }}" "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload channel artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.CHANNEL }}
          files: dist/channel/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_site_manifest:
    needs: publish
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download latest firmware bins
        run: |
          gh release download latest --repo "${{ github.repository }}" \
            --pattern "satellite1.bin" \
            --pattern "satellite1.ld2410.bin" \
            --pattern "satellite1.ld2450.bin" \
            --dir site/manifests \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated bins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/manifests/*.bin
          if git diff --cached --quiet; then
            echo "No changes to site manifest bins"
          else
            git commit -m "chore: update site manifest firmware bins for ${GITHUB_REF_NAME}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
