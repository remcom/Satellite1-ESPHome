name: Build ESPHome firmware on release

on:
  release:
    types: [published]

permissions:
  contents: write

# Never cancel a release build half-way through; just don't run two for the
# same tag at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds run in parallel, but only stage artifacts -- every write to a shared
  # release happens in the single `publish` job below, so the matrix can't race
  # itself deleting/uploading assets on the same tag.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        device:
          - satellite1
          - satellite1.ld2450
          - satellite1.ld2410
          - satellite1.secure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set version variables
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          SAFE_VERSION="${GITHUB_REF_NAME//-/_}"
          echo "SAFE_VERSION=${SAFE_VERSION}" >> $GITHUB_ENV

      - name: Get ESPHome version from requirements.txt
        run: |
          ESPHOME_VERSION=$(grep -oP 'esphome==\K[^\s]+' requirements.txt)
          if [ -z "$ESPHOME_VERSION" ]; then
            echo "Could not determine esphome version from requirements.txt"; exit 1;
          fi
          echo "ESPHOME_VERSION=${ESPHOME_VERSION}" >> $GITHUB_ENV

      - name: Write signing key for the hardened variant
        if: matrix.device == 'satellite1.secure'
        env:
          SIGNING_KEY: ${{ secrets.SECURE_BOOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::error::secrets.SECURE_BOOT_SIGNING_KEY is empty. The hardened" \
                 "variant must be signed -- an unsigned image has no public key to" \
                 "verify against, so OTA on the device would be permanently broken."
            exit 1
          fi
          # Path matches `signing_key: ../secure_boot_signing_key.pem` in
          # config/satellite1.secure.yaml (resolved relative to config/).
          printf '%s\n' "${SIGNING_KEY}" > secure_boot_signing_key.pem
          chmod 600 secure_boot_signing_key.pem

      - name: Build ESPHome firmware
        id: build
        uses: esphome/build-action@v8.0.0
        with:
          yaml-file: "config/${{ matrix.device }}.yaml"
          complete-manifest: true
          version: ${{ env.ESPHOME_VERSION }}
          release-url: ${{ github.event.release.html_url }}
          release-summary: ${{ github.event.release.body }}
          substitutions: |
            esp32_fw_version=${{ env.VERSION }}

      - name: Remove signing key
        if: always() && matrix.device == 'satellite1.secure'
        run: rm -f secure_boot_signing_key.pem

      - name: Stage versioned and channel artifacts
        env:
          DEVICE: ${{ matrix.device }}
          OUTDIR: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          SAFE_VERSION="${{ env.SAFE_VERSION }}"

          if [ ! -d "$OUTDIR" ]; then
            echo "Build output directory '$OUTDIR' not found for ${DEVICE}"; exit 1;
          fi

          mkdir -p "staging/versioned" "staging/channel"

          for f in "$OUTDIR"/*; do
            base=$(basename "$f")
            # Handle double extensions like .ota.bin
            if [[ "$base" == *.ota.bin ]]; then
              ext="ota.bin"
              channel_name="${DEVICE}.ota.bin"
            elif [[ "$base" == *.bin ]]; then
              ext="bin"
              channel_name="${DEVICE}.bin"
            elif [[ "$base" == manifest.json ]]; then
              ext="manifest.json"
              channel_name="${DEVICE}-manifest.json"
            else
              ext="${base##*.}"
              channel_name="${DEVICE}.${ext}"
            fi
            cp "$f" "staging/versioned/${DEVICE}-${SAFE_VERSION}.${ext}"
            cp "$f" "staging/channel/${channel_name}"
          done

          # ESPHome names its artifacts after the node name, which is `satellite1`
          # for every variant, so all four builds emit satellite1-esp32s3.*.bin.
          # The paths inside manifest.json must be rewritten to the per-device
          # names the files were just staged under: rewriting only the extension
          # pointed every variant's manifest at the DEFAULT variant's firmware,
          # which silently OTA'd radar devices onto the non-radar build.
          fix_manifest_paths() {
            local manifest="$1" ota="$2" factory="$3" dir p
            [ -f "$manifest" ] || return 0
            dir=$(dirname "$manifest")

            sed -i -E \
              -e "s|\"path\":[[:space:]]*\"[A-Za-z0-9._-]*\.ota\.bin\"|\"path\": \"${ota}\"|g" \
              -e "s|\"path\":[[:space:]]*\"[A-Za-z0-9._-]*\.factory\.bin\"|\"path\": \"${factory}\"|g" \
              "$manifest"

            # Every path a manifest advertises must be a file we actually staged.
            # Without this the release can publish a manifest pointing at a 404 --
            # or at another variant's firmware, which is how the wrong build ends
            # up on a device.
            while read -r p; do
              if [ ! -f "${dir}/${p}" ]; then
                echo "::error::${manifest} references '${p}', which was not staged in ${dir}"
                exit 1
              fi
            done < <(grep -oE '"path":[[:space:]]*"[^"]+"' "$manifest" | cut -d'"' -f4)
          }

          fix_manifest_paths "staging/channel/${DEVICE}-manifest.json" \
            "${DEVICE}.ota.bin" "${DEVICE}.bin"
          fix_manifest_paths "staging/versioned/${DEVICE}-${SAFE_VERSION}.manifest.json" \
            "${DEVICE}-${SAFE_VERSION}.ota.bin" "${DEVICE}-${SAFE_VERSION}.bin"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.device }}
          path: staging/
          if-no-files-found: error
          retention-days: 7

  # Single owner of both the versioned release and the rolling channel release,
  # so asset deletes/uploads are serialized across all three devices.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set version and channel variables
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          if [ "${{ github.event.release.prerelease }}" == "true" ]; then
            echo "CHANNEL=beta" >> $GITHUB_ENV
          else
            echo "CHANNEL=latest" >> $GITHUB_ENV
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Generate landing manifest
        run: |
          REPO="${GITHUB_REPOSITORY}"
          CHANNEL="${{ env.CHANNEL }}"

          cat <<EOF > dist/channel/landing-manifest.json
          {
            "version": "${GITHUB_REF_NAME}",
            "devices": {
              "satellite1": { "manifest_url": "https://github.com/${REPO}/releases/download/${CHANNEL}/satellite1-manifest.json" },
              "satellite1.ld2450": { "manifest_url": "https://github.com/${REPO}/releases/download/${CHANNEL}/satellite1.ld2450-manifest.json" },
              "satellite1.ld2410": { "manifest_url": "https://github.com/${REPO}/releases/download/${CHANNEL}/satellite1.ld2410-manifest.json" },
              "satellite1.secure": { "manifest_url": "https://github.com/${REPO}/releases/download/${CHANNEL}/satellite1.secure-manifest.json" }
            }
          }
          EOF

      - name: Upload versioned artifacts to release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/versioned/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sweep every asset this workflow owns, for all devices at once. Doing
      # this per-device in the matrix was unsafe: the `satellite1` prefix also
      # matches `satellite1.ld2410.*`, so a parallel job could delete another
      # device's freshly-uploaded assets.
      - name: Delete superseded channel assets
        run: |
          set -uo pipefail
          # A first-ever beta/latest release doesn't exist yet, and a matchless
          # grep exits 1 -- neither is an error here.
          EXISTING=$(gh release view "${{ env.CHANNEL }}" --json assets -q '.assets[].name' 2>/dev/null || true)
          STALE=$(grep -E '^(satellite1|landing-manifest\.json$)' <<< "$EXISTING" || true)
          for asset in $STALE; do
            echo "Deleting old asset: $asset"
            gh release delete-asset "${{ env.CHANNEL }}" "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload channel artifacts
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.CHANNEL }}
          files: dist/channel/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_site_manifest:
    needs: publish
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download latest firmware bins
        run: |
          gh release download latest --repo "${{ github.repository }}" \
            --pattern "satellite1.bin" \
            --pattern "satellite1.ld2410.bin" \
            --pattern "satellite1.ld2450.bin" \
            --pattern "satellite1.secure.bin" \
            --dir site/manifests \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated bins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/manifests/*.bin
          if git diff --cached --quiet; then
            echo "No changes to site manifest bins"
          else
            git commit -m "chore: update site manifest firmware bins for ${GITHUB_REF_NAME}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
