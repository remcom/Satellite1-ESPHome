repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: ^(config|\.github)/.*\.(yml|yaml)$

  # ruff, clang-format and clang-tidy versions match requirements.txt and upstream ESPHome
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        name: ruff (check) [esphome]
        files: ^(components|esphome/components)/.*\.py$
      - id: ruff-format
        name: ruff (format check) [esphome]
        files: ^(components|esphome/components)/.*\.py$
        args: ["--check"]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        name: clang-format (check, v23) [esphome]
        files: ^(components|esphome/components)/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        args: ["--dry-run", "--Werror", "--style=file"]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy [esphome]
        entry: python3 scripts/run_clang_tidy.py
        language: system
        files: ^(components|esphome/components)/.*\.(cc|cpp)$
        pass_filenames: true
        # Regenerates compile_commands.json itself (codegen + cmake configure, no ninja
        # build, ~1 min) but that's still too slow for every commit, so it's opt-in:
        # pre-commit run --hook-stage manual clang-tidy
        # For fast local iteration once compile_commands.json is fresh, run the script
        # directly with --skip-regen.
        stages: [manual]